name: Update and publish LazyCat app

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-private-store-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private store package identity
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $APPSTORE_TOKEN" \
            -H "Accept: application/json" \
            "${APPSTORE_URL%/}/api/v1/apps/$APP_ID" \
            | jq -e '.app.packageId == "community.lazycat.app.qbittorrentee"' >/dev/null
  lazycat:
    needs: validate-private-store-binding
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1.3.8
    with:
      operation: auto
      config: .github/lazycat-action.yml
      versioned-release-asset: true
    secrets:
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
